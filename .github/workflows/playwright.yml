name: Playwright Tests & Allure Report
on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
 
permissions:
  contents: write
  pages: write
  id-token: write
jobs: 

  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright Tests
      run: npx playwright test

    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results-shard-1
        path: allure-results
  report:
    if: ${{ always() }}
    needs: [test]
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
       node-version: lts/*
       cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Download Allure Raw Results
      uses: actions/download-artifact@v4
      with:
       pattern: allure-results-shard-*
       merge-multiple: true
       path: allure-results
 
    - name: Ensure Allure Results Directory
      run: mkdir -p allure-results

    - name: Generate Allure Report
      run: npm run allure:generate

    - name: Verify Allure Report Files
      run: ls -R allure-report

    - name: Upload Allure HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report
        if-no-files-found: warn
        retention-days: 14

    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' &&
        (github.ref_name == 'main' ||
         github.ref_name == 'master')

      uses: peaceiris/actions-gh-pages@v3

      with:
       github_token: ${{ secrets.GITHUB_TOKEN }}
       publish_branch: gh-pages
       publish_dir: allure-report







